<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <title>虛構示意圖，非實際住宅</title>
  <rect width="900" height="600" fill="#f4f7fc"/>
  <text x="450" y="45" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#586c89">虛構示意圖 · 非實際住宅 · 無比例尺</text>
  <g stroke="#546b88" stroke-width="7" fill="#fff">
    <rect x="85" y="85" width="730" height="430" rx="5"/>
    <path d="M510 85V515M510 335H815" fill="none"/>
  </g>
  <g fill="#edf2fa" stroke="#b7c7db" stroke-width="2">
    <rect x="135" y="330" width="170" height="70" rx="12"/>
    <rect x="345" y="225" width="100" height="100" rx="12"/>
    <rect x="565" y="215" width="170" height="65" rx="8"/>
    <rect x="565" y="375" width="75" height="80" rx="10"/>
  </g>
  <g font-family="sans-serif" font-size="23" fill="#45617f" text-anchor="middle">
    <text x="260" y="190">客廳／示意區 A</text>
    <text x="665" y="155">次臥／示意區 B</text>
    <text x="685" y="425">浴室／示意區 C</text>
  </g>
  <text x="450" y="560" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7a8ba3">僅供練習位置標記，不代表任何人的格局或尺寸</text>
</svg>
